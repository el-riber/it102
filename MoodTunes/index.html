<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodTunes — Your Emotional Music Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MoodTunes</h1>
            <p class="subtitle">Your Emotional Music Companion</p>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-value" id="moodCount">0</span>
                <span class="stat-label">Moods Explored</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="songCount">0</span>
                <span class="stat-label">Songs Discovered</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="playCount">0</span>
                <span class="stat-label">Tracks Played</span>
            </div>
        </div>

        <div class="mood-selector" id="moodSelector">
            <!-- Mood buttons will be generated here -->
        </div>

        <div class="input-section" id="inputSection">
            <label class="input-label">Create Your Own Mood 🎨</label>
            <div class="input-group">
                <input type="text" id="customMoodInput" placeholder="Enter your unique mood (e.g., 'Nostalgic', 'Adventurous')">
                <button class="add-mood-btn" onclick="app.addCustomMood()">Add Mood</button>
            </div>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="quote-card" id="quoteCard">
            <p class="quote-text" id="quoteText"></p>
        </div>

        <div class="playlist-section" id="playlistSection">
            <div class="playlist-header">
                <h2 class="playlist-title" id="playlistTitle">Your Playlist</h2>
                <button class="shuffle-btn" onclick="app.shufflePlaylist()">🔄 Shuffle</button>
            </div>
            <div id="playlistContainer"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

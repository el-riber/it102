<!DOCTYPE html>
<html>
<head>
    <title>Let's Make a Deal</title>
</head>
<body>
    <h1>Let's Make a Deal</h1>
    <hr>

    <p>Choose a door:</p>
    <select id="doorSelection">
        <option value="0">Select a Door</option>
        <option value="door1">Door #1</option>
        <option value="door2">Door #2</option>
        <option value="door3">Door #3</option>
    </select>

    <button onclick="doorPrize()">Select</button>

    <p id="prize">Good Luck!</p>

    <script>
        // Storing prizes inside a Literal Object (key-value pairs)
        const prizes = {
            door1: "New Car",
            door2: "Goat",
            door3: "Pencil"
        };

        // Function to show the selected prize
        function doorPrize() {
            let userChoice = document.getElementById("doorSelection").value;

            if (userChoice === "0") {
                document.getElementById("prize").innerHTML = "Please select a valid door.";
            } else {
                document.getElementById("prize").innerHTML = 
                    "Your prize is a " + prizes[userChoice] + "!";
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grocery List</title>
</head>
<body>
  <h2>Grocery List</h2>
  <p>Enter grocery items separated by commas.</p>
  <textarea id="groceryInput" placeholder="Enter grocery items and separate with commas"></textarea>
  <br />
  <button onclick="createGroceryList()">Create Grocery List</button>

  <pre id="groceryList"></pre>
  <p>Total items: <span id="totalItems">0</span></p>

  <script>
    // Build the grocery list from the textarea input.
    function createGroceryList() {
      // 1) Check for empty input
      const input = document.getElementById('groceryInput').value.trim();
      if (!input) {
        alert('Please enter grocery items');
        return;
      }

      // 2) Split input string into array (by comma), trim each, and drop empties
      let groceryItems = input
        .split(',')                  // split by comma
        .map(s => s.trim())          // trim whitespace around each item
        .filter(Boolean);            // remove empty strings

      // 3) Sort groceries alphabetically (case-insensitive)
      groceryItems.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

      // 4) Display the list nicely, one item per line with numbering
      const lines = groceryItems.map((item, i) => `${i + 1}. ${item}`);
      document.getElementById('groceryList').textContent = lines.join('\n'); // <pre> preserves newlines

      // 5) Show the total number of items (length of the array)
      document.getElementById('totalItems').textContent = groceryItems.length;
    }
  </script>
</body>
</html>
